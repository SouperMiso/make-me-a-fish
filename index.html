                titleEl.innerText = "You caught a shiny fih!";
                titleEl.style.color = "#FFD700";
                titleEl.style.textShadow = "4px 4px 0px #B8860B, 0 0 20px #FFD700";
            } else {
                titleEl.innerText = "11:11, make a fih!";
                titleEl.style.color = "#ffffff";
                titleEl.style.textShadow = "4px 4px 0px #333333";
            }

            const bodyWidth = randomRange(12, 220);
            const bodyHeight = randomRange(8, 140);
            const tailSize = randomRange(12, 95);
            const finType = pick(['spiky', 'poly_wing', 'crystal_fin', 'stepped_fin', 'shard_fin', 'trapezoid', 'sail_geo',
                'blade_fin', 'tiny'
            ]);

            const maxLeft = bodyWidth * 0.9 + tailSize * 1.5;
            const maxRight = bodyWidth * 1.15;
            const finBottomExt = (finType === 'sail_geo' || finType === 'poly_wing' ? 130 :
                (finType === 'spiky' || finType === 'stepped_fin' ? 75 : 90));
            const maxBottom = bodyHeight + finBottomExt;

            const neededWidth = Math.max(maxLeft, maxRight) * 2;
            const neededHeight = Math.max(maxBottom, maxBottom) * 2;

            const scaleX = window.innerWidth / neededWidth;
            const scaleY = window.innerHeight / neededHeight;
            const baseScale = Math.min(scaleX, scaleY) * 0.82;
            const finalScale = ratio * baseScale;

            const cx = canvas.width / 2;
            const cy = (canvas.height / 2) - (20 * ratio * baseScale);

            drawFishToCtx(ctx, seedString, cx, cy, finalScale, 0, true, false, 0);
            updateKeepButtonState();
        }

        function updateKeepButtonState() {
            const currentSeed = getCurrentDailySeed();
            const saved = getCurrentFish();
            if (saved.includes(currentSeed)) {
                keepBtn.innerText = "IN TANK 🐟";
                keepBtn.disabled = true;
            } else {
                keepBtn.innerText = "KEEP 🐟";
                keepBtn.disabled = false;
            }
        }

        keepBtn.addEventListener('click', () => {
            const currentSeed = getCurrentDailySeed();
            let added = addFishToCurrentTank(currentSeed);
            if (added) {
                updateKeepButtonState();
                updateDrawerUI();
                syncTankFish();
                openTank();
            }
        });

        // ─── CLIPBOARD & SVG ────────────────────────────────────────────────────

        async function copyFishToClipboard() {
            const seedString = getCurrentDailySeed();
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 1500;
            offCanvas.height = 1200;
            const oCtx = offCanvas.getContext('2d');
            drawFishToCtx(oCtx, seedString, 750, 600, 2.5, 0, true, false, 0);
            offCanvas.toBlob(async (blob) => {
                try {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    const btn = document.getElementById('copyBtn');
                    const origText = btn.innerText;
                    btn.innerText = "COPIED! ✨";
                    setTimeout(() => { btn.innerText = origText; }, 2000);
                } catch (_) { alert("Could not copy to clipboard automatically."); }
            }, 'image/png');
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('show');
        }
        window.addEventListener('click', () => {
            const menu = document.getElementById('dropdownMenu');
            if (menu && menu.classList.contains('show')) menu.classList.remove('show');
        });

        function downloadFishSVG() {
            const seedString = getCurrentDailySeed();
            const svgContent = buildFishSVG(seedString);
            const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `fish-${seedString}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ─── SVG BUILDER ──────────────────────────────────────────────────────

        function buildFishSVG(seedString) {
            const rand = seededRandom(stringToSeed(seedString));

            function randomRange(min, max) { return min + rand() * (max - min); }

            function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }

            const isShiny = rand() < 0.000000001;
            const bodyType = pick([
                'ellipse', 'box', 'diamond', 'pill', 'hexagon', 'trapezoid', 'teardrop', 'triangle',
                'peanut', 'egg', 'arrow', 'bowtie', 'stout_oval'
            ]);
            const tailType = pick([
                'triangle', 'forked', 'paddle', 'crescent', 'spiky', 'double_fan',
                'pin_tail', 'crown', 'poly_fan', 'crystal_shard', 'stepped_tail',
                'arrow_geo', 'diamond_tail', 'tri_blade'
            ]);
            const finType = pick(['spiky', 'poly_wing', 'crystal_fin', 'stepped_fin', 'shard_fin', 'trapezoid', 'sail_geo',
                'blade_fin', 'tiny'
            ]);
            const patternType = pick([
                'scales', 'stripes', 'grid', 'x_cross', 'halftone', 'sparkles', 'waves', 'chevrons',
                'polka_ring', 'triangles', 'argyle', 'confetti', 'diamonds', 'concentric_circles',
                'hex_grid', 'brick', 'stripes_horizontal', 'diagonal_stripes', 'zigzag', 'checkerboard', 'none'
            ]);
            const eyeType = pick([
                'round', 'square', 'diamond', 'hexagon', 'slit', 'anime',
                'sleepy', 'star', 'dot', 'winky', 'glasses', 'angry_geo',
                'surprised_geo', 'focused_geo', 'cyborg_geo'
            ]);

            const bodyWidth = randomRange(12, 220);
            const bodyHeight = randomRange(8, 140);
            const tailSize = randomRange(12, 95);
            const tailAngle = randomRange(0.3, 0.9);
            const palette = getFishPalette(rand, isShiny);

            const bodyColor = hslToHex(palette.bodyH, palette.bodyS, palette.bodyL);
            const finColor = hslToHex(palette.finH, palette.finS, palette.finL);
            const [sR, sG, sB] = hslToRgb(palette.scaleH, palette.scaleS, palette.scaleL);
            const scaleColor = `rgb(${sR},${sG},${sB})`;
            const scaleOpacity = 0.55;

            const tailX = -bodyWidth + (bodyWidth * 0.1);
            let tailPath = '';
            if (tailType === 'triangle') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize},${-tailSize * tailAngle} ${tailX - tailSize},${tailSize * tailAngle}" fill="${finColor}"/>`;
            } else if (tailType === 'forked') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize},${-tailSize * tailAngle} ${tailX - tailSize * 0.4},0 ${tailX - tailSize},${tailSize * tailAngle}" fill="${finColor}"/>`;
            } else if (tailType === 'paddle') {
                tailPath =
                    `<rect x="${tailX - tailSize}" y="${-tailSize * tailAngle / 2}" width="${tailSize}" height="${tailSize * tailAngle}" rx="10" fill="${finColor}"/>`;
            } else if (tailType === 'crescent') {
                tailPath =
                    `<path d="M ${tailX} 0 A ${tailSize} ${tailSize} 0 0 1 ${tailX - tailSize} ${tailSize*0.8} A ${tailSize*0.8} ${tailSize*0.8} 0 0 0 ${tailX - tailSize} ${-tailSize*0.8} A ${tailSize} ${tailSize} 0 0 1 ${tailX} 0 Z" fill="${finColor}"/>`;
            } else if (tailType === 'double_fan') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize},${-tailSize*0.9} ${tailX - tailSize*0.7},${-tailSize*0.2} ${tailX},0 ${tailX - tailSize*0.7},${tailSize*0.2} ${tailX - tailSize},${tailSize*0.9}" fill="${finColor}"/>`;
            } else if (tailType === 'pin_tail') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize*0.5},${-tailSize*0.4} ${tailX - tailSize*1.8},0 ${tailX - tailSize*0.5},${tailSize*0.4}" fill="${finColor}"/>`;
            } else if (tailType === 'crown') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize},${-tailSize*0.8} ${tailX - tailSize*0.6},${-tailSize*0.3} ${tailX - tailSize*1.2},0 ${tailX - tailSize*0.6},${tailSize*0.3} ${tailX - tailSize},${tailSize*0.8}" fill="${finColor}"/>`;
            } else if (tailType === 'poly_fan') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize*0.5},${-tailSize*0.5} ${tailX - tailSize*1.1},${-tailSize*0.95} ${tailX - tailSize*0.75},${-tailSize*0.3} ${tailX - tailSize*1.25},0 ${tailX - tailSize*0.75},${tailSize*0.3} ${tailX - tailSize*1.1},${tailSize*0.95} ${tailX - tailSize*0.5},${tailSize*0.5}" fill="${finColor}"/>`;
            } else if (tailType === 'crystal_shard') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize*0.4},${-tailSize*0.7} ${tailX - tailSize*1.3},${-tailSize*0.5} ${tailX - tailSize*0.8},0 ${tailX - tailSize*1.3},${tailSize*0.5} ${tailX - tailSize*0.4},${tailSize*0.7}" fill="${finColor}"/>`;
            } else if (tailType === 'stepped_tail') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize*0.3},${-tailSize*0.3} ${tailX - tailSize*0.3},${-tailSize*0.7} ${tailX - tailSize*0.7},${-tailSize*0.7} ${tailX - tailSize*0.7},${-tailSize*0.2} ${tailX - tailSize*1.2},${-tailSize*0.2} ${tailX - tailSize*1.2},${tailSize*0.2} ${tailX - tailSize*0.7},${tailSize*0.2} ${tailX - tailSize*0.7},${tailSize*0.7} ${tailX - tailSize*0.3},${tailSize*0.7} ${tailX - tailSize*0.3},${tailSize*0.3}" fill="${finColor}"/>`;
            } else if (tailType === 'arrow_geo') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize*0.6},${-tailSize*0.8} ${tailX - tailSize*0.8},${-tailSize*0.8} ${tailX - tailSize*0.4},0 ${tailX - tailSize*1.4},0 ${tailX - tailSize*0.4},0 ${tailX - tailSize*0.8},${tailSize*0.8} ${tailX - tailSize*0.6},${tailSize*0.8}" fill="${finColor}"/>`;
            } else if (tailType === 'diamond_tail') {
                tailPath =
                    `<g fill="${finColor}"><polygon points="${tailX},0 ${tailX - tailSize*0.4},${-tailSize*0.4} ${tailX - tailSize*0.8},0 ${tailX - tailSize*0.4},${tailSize*0.4}"/><polygon points="${tailX - tailSize*0.7},0 ${tailX - tailSize*1.1},${-tailSize*0.6} ${tailX - tailSize*1.5},0 ${tailX - tailSize*1.1},${tailSize*0.6}"/></g>`;
            } else if (tailType === 'tri_blade') {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize*1.1},${-tailSize*0.85} ${tailX - tailSize*0.6},${-tailSize*0.1} ${tailX - tailSize*1.3},0 ${tailX - tailSize*0.6},${tailSize*0.1} ${tailX - tailSize*1.1},${tailSize*0.85}" fill="${finColor}"/>`;
            } else {
                tailPath =
                    `<polygon points="${tailX},0 ${tailX - tailSize},${-tailSize*0.8} ${tailX - tailSize*0.6},${-tailSize*0.2} ${tailX - tailSize*1.2},0 ${tailX - tailSize*0.6},${tailSize*0.2} ${tailX - tailSize},${tailSize*0.8}" fill="${finColor}"/>`;
            }

            function getFinSvg(isTop) {
                const dir = isTop ? -1 : 1;
                if (finType === 'poly_wing') {
                    return `<polygon points="${-bodyWidth*0.4},${bodyHeight*0.6*dir} ${-bodyWidth*0.1},${(bodyHeight+90)*dir} ${bodyWidth*0.4},${(bodyHeight+110)*dir} ${bodyWidth*0.5},${bodyHeight*0.7*dir}" fill="${finColor}"/>`;
                } else if (finType === 'spiky') {
                    return `<polygon points="${-bodyWidth*0.3},${bodyHeight*dir} -10,${(bodyHeight+70)*dir} 20,${(bodyHeight+35)*dir} 50,${(bodyHeight+85)*dir} ${bodyWidth*0.5},${bodyHeight*dir}" fill="${finColor}"/>`;
                } else if (finType === 'crystal_fin') {
                    return `<polygon points="${-bodyWidth*0.3},${bodyHeight*0.7*dir} 0,${(bodyHeight+110)*dir} ${bodyWidth*0.3},${(bodyHeight+50)*dir} ${bodyWidth*0.45},${bodyHeight*0.8*dir}" fill="${finColor}"/>`;
                } else if (finType === 'stepped_fin') {
                    return `<polygon points="${-bodyWidth*0.4},${bodyHeight*dir} ${-bodyWidth*0.4},${(bodyHeight+40)*dir} ${-bodyWidth*0.1},${(bodyHeight+40)*dir} ${-bodyWidth*0.1},${(bodyHeight+80)*dir} ${bodyWidth*0.2},${(bodyHeight+80)*dir} ${bodyWidth*0.2},${bodyHeight*dir}" fill="${finColor}"/>`;
                } else if (finType === 'shard_fin') {
                    return `<polygon points="${-bodyWidth*0.5},${bodyHeight*0.8*dir} ${-bodyWidth*0.2},${(bodyHeight+95)*dir} ${bodyWidth*0.1},${(bodyHeight+40)*dir} ${bodyWidth*0.4},${(bodyHeight+85)*dir} ${bodyWidth*0.5},${bodyHeight*0.8*dir}" fill="${finColor}"/>`;
                } else if (finType === 'trapezoid') {
                    return `<polygon points="${-bodyWidth*0.4},${bodyHeight*dir} ${-bodyWidth*0.2},${(bodyHeight+65)*dir} ${bodyWidth*0.3},${(bodyHeight+65)*dir} ${bodyWidth*0.5},${bodyHeight*dir}" fill="${finColor}"/>`;
                } else if (finType === 'sail_geo') {
                    return `<polygon points="${-bodyWidth*0.5},${bodyHeight*0.5*dir} ${-bodyWidth*0.1},${(bodyHeight+140)*dir} ${bodyWidth*0.3},${(bodyHeight+90)*dir} ${bodyWidth*0.5},${bodyHeight*0.6*dir}" fill="${finColor}"/>`;
                } else if (finType === 'blade_fin') {
                    return `<polygon points="${-bodyWidth*0.3},${bodyHeight*0.8*dir} ${bodyWidth*0.1},${(bodyHeight+115)*dir} ${bodyWidth*0.6},${bodyHeight*0.7*dir}" fill="${finColor}"/>`;
                } else {
                    return `<polygon points="-30,${bodyHeight*dir} 0,${(bodyHeight+35)*dir} 30,${bodyHeight*dir}" fill="${finColor}"/>`;
                }
            }
            const finPaths = getFinSvg(true) + getFinSvg(false);

            let bodySvg = '',
                clipSvg = '';
            if (bodyType === 'ellipse') {
                bodySvg = `<ellipse cx="0" cy="0" rx="${bodyWidth}" ry="${bodyHeight}" fill="${bodyColor}"/>`;
                clipSvg = `<ellipse cx="0" cy="0" rx="${bodyWidth}" ry="${bodyHeight}"/>`;
            } else if (bodyType === 'box') {
                bodySvg =
                    `<rect x="${-bodyWidth}" y="${-bodyHeight}" width="${bodyWidth*2}" height="${bodyHeight*2}" rx="20" fill="${bodyColor}"/>`;
                clipSvg =
                    `<rect x="${-bodyWidth}" y="${-bodyHeight}" width="${bodyWidth*2}" height="${bodyHeight*2}" rx="20"/>`;
            } else if (bodyType === 'pill') {
                bodySvg =
                    `<rect x="${-bodyWidth}" y="${-bodyHeight}" width="${bodyWidth*2}" height="${bodyHeight*2}" rx="${bodyHeight}" fill="${bodyColor}"/>`;
                clipSvg =
                    `<rect x="${-bodyWidth}" y="${-bodyHeight}" width="${bodyWidth*2}" height="${bodyHeight*2}" rx="${bodyHeight}"/>`;
            } else if (bodyType === 'diamond') {
                const d = `M ${-bodyWidth} 0 L 0 ${-bodyHeight} L ${bodyWidth} 0 L 0 ${bodyHeight} Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'hexagon') {
                let pts = [];
                for (let i = 0; i < 6; i++) {
                    let angle = (Math.PI / 3) * i;
                    pts.push(`${bodyWidth * Math.cos(angle)},${bodyHeight * Math.sin(angle)}`);
                }
                bodySvg = `<polygon points="${pts.join(' ')}" fill="${bodyColor}"/>`;
                clipSvg = `<polygon points="${pts.join(' ')}"/>`;
            } else if (bodyType === 'trapezoid') {
                const d =
                    `M ${-bodyWidth} ${bodyHeight} L ${bodyWidth} ${bodyHeight} L ${bodyWidth*0.6} ${-bodyHeight} L ${-bodyWidth*0.6} ${-bodyHeight} Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'teardrop') {
                const d =
                    `M ${-bodyWidth} 0 C ${-bodyWidth} ${-bodyHeight}, ${bodyWidth} ${-bodyHeight}, ${bodyWidth} 0 C ${bodyWidth} ${bodyHeight}, ${-bodyWidth} ${bodyHeight}, ${-bodyWidth} 0 Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'peanut') {
                const d =
                    `M ${-bodyWidth} 0 C ${-bodyWidth} ${-bodyHeight*1.1}, ${-bodyWidth*0.1} ${-bodyHeight*0.4}, ${bodyWidth*0.5} ${-bodyHeight} C ${bodyWidth*0.9} ${-bodyHeight*0.9}, ${bodyWidth} ${-bodyHeight*0.4}, ${bodyWidth} 0 C ${bodyWidth} ${bodyHeight*0.4}, ${bodyWidth*0.9} ${bodyHeight*0.9}, ${bodyWidth*0.5} ${bodyHeight} C ${-bodyWidth*0.1} ${bodyHeight*0.4}, ${-bodyWidth} ${bodyHeight*1.1}, ${-bodyWidth} 0 Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'egg') {
                const d =
                    `M ${-bodyWidth} 0 C ${-bodyWidth} ${-bodyHeight*1.2}, ${bodyWidth*0.6} ${-bodyHeight*0.7}, ${bodyWidth} 0 C ${bodyWidth*0.6} ${bodyHeight*0.7}, ${-bodyWidth} ${bodyHeight*1.2}, ${-bodyWidth} 0 Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'arrow') {
                const d =
                    `M ${bodyWidth} 0 L ${-bodyWidth*0.3} ${-bodyHeight} L ${-bodyWidth} ${-bodyHeight*0.6} L ${-bodyWidth*0.6} 0 L ${-bodyWidth} ${bodyHeight*0.6} L ${-bodyWidth*0.3} ${bodyHeight} Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'bowtie') {
                const d =
                    `M ${-bodyWidth} ${-bodyHeight} L 0 ${-bodyHeight*0.3} L ${bodyWidth} ${-bodyHeight} L ${bodyWidth} ${bodyHeight} L 0 ${bodyHeight*0.3} L ${-bodyWidth} ${bodyHeight} Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            } else if (bodyType === 'stout_oval') {
                bodySvg = `<ellipse cx="0" cy="0" rx="${bodyWidth*0.85}" ry="${bodyHeight*1.1}" fill="${bodyColor}"/>`;
                clipSvg = `<ellipse cx="0" cy="0" rx="${bodyWidth*0.85}" ry="${bodyHeight*1.1}"/>`;
            } else {
                const d = `M ${-bodyWidth} ${bodyHeight} L ${bodyWidth} 0 L ${-bodyWidth} ${-bodyHeight} Z`;
                bodySvg = `<path d="${d}" fill="${bodyColor}"/>`;
                clipSvg = `<path d="${d}"/>`;
            }

            let patternElements = '';
            const patternScale = randomRange(12, 22);
            if (patternType === 'scales') {
                let paths = [];
                for (let x = bodyWidth; x > -bodyWidth; x -= patternScale * 0.8) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 1.2) {
                        let yOffset = (Math.floor(x / patternScale) % 2 === 0) ? (patternScale * 0.6) : 0;
                        paths.push(
                            `M ${x} ${y + yOffset - patternScale} A ${patternScale} ${patternScale} 0 0 1 ${x} ${y + yOffset + patternScale}`
                            );
                    }
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="3" fill="none"/>`;
            } else if (patternType === 'stripes') {
                let paths = [];
                for (let x = -bodyWidth + 10; x < bodyWidth; x += patternScale * 1.5) {
                    paths.push(`M ${x} ${-bodyHeight} L ${x} ${bodyHeight}`);
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="12" fill="none"/>`;
            } else if (patternType === 'grid') {
                let paths = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale) paths.push(`M ${x} ${-bodyHeight} L ${x} ${bodyHeight}`);
                for (let y = -bodyHeight; y < bodyHeight; y += patternScale) paths.push(`M ${-bodyWidth} ${y} L ${bodyWidth} ${y}`);
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="4" fill="none"/>`;
            } else if (patternType === 'x_cross') {
                let paths = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale) {
                        paths.push(
                            `M ${x - patternScale*0.3} ${y - patternScale*0.3} L ${x + patternScale*0.3} ${y + patternScale*0.3}`
                            );
                        paths.push(
                            `M ${x + patternScale*0.3} ${y - patternScale*0.3} L ${x - patternScale*0.3} ${y + patternScale*0.3}`
                            );
                    }
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="3" fill="none"/>`;
            } else if (patternType === 'halftone') {
                let circles = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale * 0.9) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 0.9) {
                        let normX = (x + bodyWidth) / (bodyWidth * 2);
                        let r = Math.max(1.5, (patternScale * 0.45) * Math.sin(normX * Math.PI));
                        circles.push(
                            `<circle cx="${x}" cy="${y}" r="${r}" fill="${scaleColor}" fill-opacity="${scaleOpacity}"/>`
                            );
                    }
                }
                patternElements = circles.join('');
            } else if (patternType === 'sparkles') {
                let paths = [];
                for (let i = 0; i < Math.floor(randomRange(25, 55)); i++) {
                    let sx = randomRange(-bodyWidth, bodyWidth);
                    let sy = randomRange(-bodyHeight, bodyHeight);
                    let size = randomRange(4, 12);
                    paths.push(
                        `M ${sx} ${sy - size} L ${sx + size*0.25} ${sy - size*0.25} L ${sx + size} ${sy} L ${sx + size*0.25} ${sy + size*0.25} L ${sx} ${sy + size} L ${sx - size*0.25} ${sy + size*0.25} L ${sx - size} ${sy} L ${sx - size*0.25} ${sy - size*0.25} Z`
                        );
                }
                patternElements =
                    `<path d="${paths.join(' ')}" fill="${scaleColor}" fill-opacity="${scaleOpacity}"/>`;
            } else if (patternType === 'waves') {
                let paths = [];
                for (let y = -bodyHeight; y < bodyHeight; y += patternScale) {
                    let wavePoints = [];
                    for (let x = -bodyWidth; x <= bodyWidth; x += 6) {
                        let waveY = y + Math.sin((x / patternScale) * Math.PI) * (patternScale * 0.3);
                        wavePoints.push(`${x === -bodyWidth ? 'M' : 'L'} ${x} ${waveY}`);
                    }
                    paths.push(wavePoints.join(' '));
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="4" fill="none"/>`;
            } else if (patternType === 'chevrons') {
                let paths = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale * 1.2) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 1.2) {
                        paths.push(
                            `M ${x - patternScale*0.4} ${y - patternScale*0.4} L ${x} ${y} L ${x - patternScale*0.4} ${y + patternScale*0.4}`
                            );
                    }
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="4" fill="none"/>`;
            } else if (patternType === 'polka_ring') {
                let rings = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale * 1.2) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 1.2) {
                        rings.push(
                            `<circle cx="${x}" cy="${y}" r="${patternScale*0.35}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="3" fill="none"/>`
                            );
                    }
                }
                patternElements = rings.join('');
            } else if (patternType === 'triangles') {
                let tris = [];
                for (let i = 0; i < Math.floor(randomRange(20, 45)); i++) {
                    let tx = randomRange(-bodyWidth, bodyWidth);
                    let ty = randomRange(-bodyHeight, bodyHeight);
                    let ts = randomRange(6, 16);
                    tris.push(`M ${tx} ${ty - ts} L ${tx + ts} ${ty + ts} L ${tx - ts} ${ty + ts} Z`);
                }
                patternElements =
                    `<path d="${tris.join(' ')}" fill="${scaleColor}" fill-opacity="${scaleOpacity}"/>`;
            } else if (patternType === 'argyle') {
                let paths = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale * 1.4) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 1.4) {
                        paths.push(
                            `M ${x} ${y - patternScale*0.5} L ${x + patternScale*0.5} ${y} L ${x} ${y + patternScale*0.5} L ${x - patternScale*0.5} ${y} Z`
                            );
                    }
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="2" fill="none"/>`;
            } else if (patternType === 'diamonds') {
                let paths = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale * 1.2) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 1.2) {
                        paths.push(
                            `M ${x} ${y - patternScale * 0.4} L ${x + patternScale * 0.4} ${y} L ${x} ${y + patternScale * 0.4} L ${x - patternScale * 0.4} ${y} Z`
                            );
                    }
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="2" fill="none"/>`;
            } else if (patternType === 'concentric_circles') {
                let circles = [];
                for (let x = -bodyWidth; x < bodyWidth; x += patternScale * 2) {
                    for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 2) {
                        for (let r = patternScale * 0.3; r <= patternScale * 0.8; r += patternScale * 0.25) {
                            circles.push(
                                `<circle cx="${x}" cy="${y}" r="${r}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="2" fill="none"/>`
                                );
                        }
                    }
                }
                patternElements = circles.join('');
            } else if (patternType === 'hex_grid') {
                let paths = [];
                const h = patternScale * 0.866;
                for (let y = -bodyHeight - patternScale; y < bodyHeight + patternScale; y += h * 1.5) {
                    for (let x = -bodyWidth - patternScale; x < bodyWidth + patternScale; x += patternScale * 1.732) {
                        let shiftX = (Math.floor((y + bodyHeight) / (h * 1.5)) % 2 === 0) ? 0 : patternScale * 0.866;
                        let pts = [];
                        for (let k = 0; k < 6; k++) {
                            let a = (Math.PI / 3) * k;
                            pts.push(
                                `${x + shiftX + patternScale * 0.5 * Math.cos(a)},${y + patternScale * 0.5 * Math.sin(a)}`
                                );
                        }
                        paths.push(`M ${pts.join(' L ')} Z`);
                    }
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="2" fill="none"/>`;
            } else if (patternType === 'brick') {
                let paths = [];
                let rowIdx = 0;
                for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 0.6) {
                    let offset = (rowIdx % 2 === 0) ? 0 : patternScale * 0.6;
                    paths.push(`M ${-bodyWidth} ${y} L ${bodyWidth} ${y}`);
                    for (let x = -bodyWidth + offset; x < bodyWidth; x += patternScale * 1.2) {
                        paths.push(`M ${x} ${y} L ${x} ${y + patternScale * 0.6}`);
                    }
                    rowIdx++;
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="2" fill="none"/>`;
            } else if (patternType === 'stripes_horizontal') {
                let paths = [];
                for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 1.2) {
                    paths.push(`M ${-bodyWidth} ${y} L ${bodyWidth} ${y}`);
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="8" fill="none"/>`;
            } else if (patternType === 'diagonal_stripes') {
                let paths = [];
                for (let d = -bodyWidth - bodyHeight; d < bodyWidth + bodyHeight; d += patternScale * 1.2) {
                    paths.push(`M ${d - bodyHeight} ${-bodyHeight} L ${d + bodyHeight} ${bodyHeight}`);
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="6" fill="none"/>`;
            } else if (patternType === 'zigzag') {
                let paths = [];
                for (let y = -bodyHeight; y < bodyHeight; y += patternScale * 0.8) {
                    let pts = [];
                    let up = true;
                    for (let x = -bodyWidth; x <= bodyWidth; x += patternScale * 0.5) {
                        let zy = y + (up ? -patternScale * 0.3 : patternScale * 0.3);
                        pts.push(`${x},${zy}`);
                        up = !up;
                    }
                    paths.push(`M ${pts.join(' L ')}`);
                }
                patternElements =
                    `<path d="${paths.join(' ')}" stroke="${scaleColor}" stroke-opacity="${scaleOpacity}" stroke-width="3" fill="none"/>`;
            } else if (patternType === 'checkerboard') {
                let size = patternScale * 0.8;
                let rects = [];
                let col = 0;
                for (let x = -bodyWidth; x < bodyWidth; x += size) {
                    let row = 0;
                    for (let y = -bodyHeight; y < bodyHeight; y += size) {
                        if ((col + row) % 2 === 0) {
                            rects.push(
                                `<rect x="${x}" y="${y}" width="${size}" height="${size}" fill="${scaleColor}" fill-opacity="${scaleOpacity}"/>`
                                );
                        }
                        row++;
                    }
                    col++;
                }
                patternElements = rects.join('');
            }

            const eyeX = bodyWidth * (bodyType === 'diamond' || bodyType === 'triangle' || bodyType === 'arrow' ? 0.25 :
            0.5);
            const eyeY = -bodyHeight * 0.2;
            const eyeRadius = randomRange(8, 18);
            let eyeSvg = '';
            if (eyeType === 'square') {
                eyeSvg =
                    `<rect x="${eyeX - eyeRadius}" y="${eyeY - eyeRadius}" width="${eyeRadius*2}" height="${eyeRadius*2}" fill="#FFFFFF"/>` +
                    `<rect x="${eyeX}" y="${eyeY - eyeRadius/2}" width="${eyeRadius}" height="${eyeRadius}" fill="#000000"/>`;
            } else if (eyeType === 'diamond') {
                eyeSvg =
                    `<polygon points="${eyeX},${eyeY - eyeRadius*1.2} ${eyeX + eyeRadius*1.1},${eyeY} ${eyeX},${eyeY + eyeRadius*1.2} ${eyeX - eyeRadius*1.1},${eyeY}" fill="#FFFFFF"/>` +
                    `<rect x="${eyeX - eyeRadius*0.2}" y="${eyeY - eyeRadius*0.4}" width="${eyeRadius*0.7}" height="${eyeRadius*0.8}" fill="#000000"/>`;
            } else if (eyeType === 'hexagon') {
                let outer = [],
                    inner = [];
                for (let i = 0; i < 6; i++) {
                    let a = (Math.PI / 3) * i;
                    outer.push(`${eyeX + eyeRadius*Math.cos(a)},${eyeY + eyeRadius*Math.sin(a)}`);
                    inner.push(
                        `${eyeX + eyeRadius*0.2 + eyeRadius*0.4*Math.cos(a)},${eyeY + eyeRadius*0.4*Math.sin(a)}`);
                }
                eyeSvg =
                    `<polygon points="${outer.join(' ')}" fill="#FFFFFF"/><polygon points="${inner.join(' ')}" fill="#000000"/>`;
            } else if (eyeType === 'angry_geo') {
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<circle cx="${eyeX + eyeRadius*0.2}" cy="${eyeY + eyeRadius*0.1}" r="${eyeRadius*0.5}" fill="#000000"/>` +
                    `<polygon points="${eyeX - eyeRadius*1.3},${eyeY - eyeRadius*1.2} ${eyeX + eyeRadius*1.3},${eyeY - eyeRadius*0.2} ${eyeX + eyeRadius*1.3},${eyeY - eyeRadius*1.4}" fill="${bodyColor}"/>` +
                    `<line x1="${eyeX - eyeRadius*1.2}" y1="${eyeY - eyeRadius*0.9}" x2="${eyeX + eyeRadius*1.2}" y2="${eyeY - eyeRadius*0.1}" stroke="#000000" stroke-width="3"/>`;
            } else if (eyeType === 'surprised_geo') {
                let oct = [];
                for (let i = 0; i < 8; i++) {
                    let a = (Math.PI / 4) * i;
                    oct.push(`${eyeX + eyeRadius*Math.cos(a)},${eyeY + eyeRadius*Math.sin(a)}`);
                }
                eyeSvg =
                    `<polygon points="${oct.join(' ')}" fill="#FFFFFF"/><rect x="${eyeX - eyeRadius*0.3}" y="${eyeY - eyeRadius*0.3}" width="${eyeRadius*0.6}" height="${eyeRadius*0.6}" fill="#000000"/>`;
            } else if (eyeType === 'focused_geo') {
                eyeSvg =
                    `<rect x="${eyeX - eyeRadius}" y="${eyeY - eyeRadius*0.8}" width="${eyeRadius*1.8}" height="${eyeRadius*1.6}" fill="#FFFFFF"/>` +
                    `<polygon points="${eyeX - eyeRadius*0.2},${eyeY - eyeRadius*0.5} ${eyeX + eyeRadius*0.6},${eyeY} ${eyeX - eyeRadius*0.2},${eyeY + eyeRadius*0.5}" fill="#000000"/>`;
            } else if (eyeType === 'cyborg_geo') {
                eyeSvg =
                    `<rect x="${eyeX - eyeRadius}" y="${eyeY - eyeRadius}" width="${eyeRadius*2}" height="${eyeRadius*2}" fill="#FFFFFF"/>` +
                    `<rect x="${eyeX - eyeRadius*0.6}" y="${eyeY - eyeRadius*0.6}" width="${eyeRadius*1.2}" height="${eyeRadius*1.2}" fill="#000000"/>` +
                    `<rect x="${eyeX - eyeRadius*0.2}" y="${eyeY - eyeRadius*0.2}" width="${eyeRadius*0.4}" height="${eyeRadius*0.4}" fill="#00FFFF"/>`;
            } else if (eyeType === 'star') {
                let pts = [];
                for (let i = 0; i < 5; i++) {
                    let a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                    pts.push(`${eyeX + Math.cos(a)*(eyeRadius*0.7)},${eyeY + Math.sin(a)*(eyeRadius*0.7)}`);
                }
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<polygon points="${pts.join(' ')}" fill="#000000"/>`;
            } else if (eyeType === 'dot') {
                eyeSvg = `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius*0.45}" fill="#000000"/>`;
            } else if (eyeType === 'winky') {
                eyeSvg =
                    `<path d="M ${eyeX - eyeRadius*0.75} ${eyeY} A ${eyeRadius*0.75} ${eyeRadius*0.75} 0 0 1 ${eyeX + eyeRadius*0.75} ${eyeY}" stroke="#000000" stroke-width="4" fill="none"/>`;
            } else if (eyeType === 'glasses') {
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<circle cx="${eyeX + eyeRadius*0.2}" cy="${eyeY}" r="${eyeRadius*0.5}" fill="#000000"/>` +
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius*1.1}" stroke="#000000" stroke-width="3" fill="none"/>` +
                    `<line x1="${eyeX - eyeRadius*1.1}" y1="${eyeY}" x2="${eyeX - eyeRadius*1.8}" y2="${eyeY - eyeRadius*0.5}" stroke="#000000" stroke-width="3"/>`;
            } else if (eyeType === 'slit') {
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<ellipse cx="${eyeX + eyeRadius*0.2}" cy="${eyeY}" rx="${eyeRadius*0.2}" ry="${eyeRadius*0.8}" fill="#000000"/>`;
            } else if (eyeType === 'anime') {
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<ellipse cx="${eyeX}" cy="${eyeY}" rx="${eyeRadius*0.7}" ry="${eyeRadius*0.85}" fill="#000000"/>` +
                    `<circle cx="${eyeX - eyeRadius*0.2}" cy="${eyeY - eyeRadius*0.3}" r="${eyeRadius*0.25}" fill="#FFFFFF"/>` +
                    `<circle cx="${eyeX + eyeRadius*0.2}" cy="${eyeY + eyeRadius*0.3}" r="${eyeRadius*0.1}" fill="#FFFFFF"/>`;
            } else if (eyeType === 'sleepy') {
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<circle cx="${eyeX + eyeRadius*0.2}" cy="${eyeY + eyeRadius*0.2}" r="${eyeRadius*0.4}" fill="#000000"/>` +
                    `<rect x="${eyeX - eyeRadius}" y="${eyeY - eyeRadius}" width="${eyeRadius*2}" height="${eyeRadius*1.1}" fill="${bodyColor}"/>` +
                    `<line x1="${eyeX - eyeRadius}" y1="${eyeY + eyeRadius*0.1}" x2="${eyeX + eyeRadius}" y2="${eyeY + eyeRadius*0.1}" stroke="#000000" stroke-width="2"/>`;
            } else {
                eyeSvg =
                    `<circle cx="${eyeX}" cy="${eyeY}" r="${eyeRadius}" fill="#FFFFFF"/>` +
                    `<circle cx="${eyeX + eyeRadius*0.2}" cy="${eyeY}" r="${eyeRadius*0.5}" fill="#000000"/>`;
            }

            const viewBoxW = Math.max(400, (bodyWidth + tailSize) * 2.5);
            const viewBoxH = Math.max(300, bodyHeight * 3.5);

            return `<?xml version="1.0" encoding="UTF-8"?>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="${-viewBoxW/2} ${-viewBoxH/2} ${viewBoxW} ${viewBoxH}" width="800" height="600">
          <defs>
            <clipPath id="body-clip-layer">
              ${clipSvg}
            </clipPath>
          </defs>
          <g id="Layer_Tail">
            ${tailPath}
          </g>
          <g id="Layer_Fins">
            ${finPaths}
          </g>
          <g id="Layer_Body">
            ${bodySvg}
          </g>
          <g id="Layer_Patterns" clip-path="url(#body-clip-layer)">
            ${patternElements}
          </g>
          <g id="Layer_Eye">
            ${eyeSvg}
          </g>
        </svg>`;
        }

        // ─── TANK DRAWER ────────────────────────────────────────────────────────

        const tankDrawer = document.getElementById('tankDrawer');
        const tankToggleBtn = document.getElementById('tankToggleBtn');
        let isTankOpen = false;

        function toggleTank() {
            if (pipWindowInstance) return;
            isTankOpen = !isTankOpen;
            if (isTankOpen) openTank();
            else closeTank();
        }

        function openTank() {
            if (pipWindowInstance) return;
            isTankOpen = true;
            tankDrawer.classList.add('open');
            updateDrawerUI();
            syncTankFish();
            if (tankCanvasEl) {
                setupCanvasClickHandler(tankCanvasEl, false);
                // Re-apply cursor with !important
                applyFishCursor(tankCanvasEl);
            }
        }

        function closeTank() {
            isTankOpen = false;
            tankDrawer.classList.remove('open');
        }

        function setTankButtonState(poppedOut) {
            tankToggleBtn.disabled = poppedOut;
            tankToggleBtn.title = poppedOut ? "Fish tank is popped out in another window" : "";
        }

        function setTankTheme(theme) {
            currentTankTheme = theme;
            document.getElementById('dayBtn').classList.toggle('active', theme === 'day');
            document.getElementById('nightBtn').classList.toggle('active', theme === 'night');
        }

        // ─── BACKGROUND & ENVIRONMENT ─────────────────────────────────────────

        const BAYER_4X4 = [
            [0, 8, 2, 10],
            [12, 4, 14, 6],
            [3, 11, 1, 9],
            [15, 7, 13, 5]
        ];

        let bgCacheMap = new Map();

        function getDitheredBgCache(w, h, ratio, theme) {
            const key = `${w}_${h}_${ratio}_${theme}`;
            if (bgCacheMap.has(key)) return bgCacheMap.get(key);
            if (bgCacheMap.size > 8) bgCacheMap.clear();

            const offCanvas = document.createElement('canvas');
            offCanvas.width = w;
            offCanvas.height = h;
            const tCtx = offCanvas.getContext('2d');

            const px = Math.max(2, Math.floor(4 * ratio));

            let colorStops = (theme === 'day') ? [
                [0, 150, 200],
                [10, 110, 170],
                [15, 70, 130],
                [10, 35, 75]
            ] : [
                [10, 30, 60],
                [8, 22, 45],
                [5, 15, 30],
                [2, 8, 18]
            ];

            const rows = Math.ceil(h / px);
            const cols = Math.ceil(w / px);

            for (let r = 0; r < rows; r++) {
                let normY = r / rows;
                let totalStops = colorStops.length - 1;
                let scaledY = normY * totalStops;
                let stopIndex = Math.min(Math.floor(scaledY), totalStops - 1);
                let frac = scaledY - stopIndex;
                let c1 = colorStops[stopIndex];
                let c2 = colorStops[stopIndex + 1];

                for (let c = 0; c < cols; c++) {
                    let ditherVal = (BAYER_4X4[r % 4][c % 4] / 16) - 0.5;
                    let blendedFrac = Math.min(1, Math.max(0, frac + ditherVal * 0.35));
                    let red = Math.round(c1[0] + (c2[0] - c1[0]) * blendedFrac);
                    let green = Math.round(c1[1] + (c2[1] - c1[1]) * blendedFrac);
                    let blue = Math.round(c1[2] + (c2[2] - c1[2]) * blendedFrac);
                    tCtx.fillStyle = `rgb(${red},${green},${blue})`;
                    tCtx.fillRect(c * px, r * px, px, px);
                }
            }

            const floorHeight = px * 3;
            const gravelY = h - floorHeight;
            tCtx.fillStyle = theme === 'day' ? '#141e28' : '#0a1018';
            tCtx.fillRect(0, gravelY, w, floorHeight);

            const pebbleColors = theme === 'day' ?
                ['#2d1b4e', '#432368', '#632c7e', '#883794', '#00a896', '#028090'] :
                ['#180e2b', '#26123d', '#3d1a4e', '#572061', '#005f56', '#014c56'];

            const step = px * 1.2;
            for (let x = 0; x < w; x += step) {
                for (let y = gravelY; y < h; y += step) {
                    let seed = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
                    let colorIdx = Math.floor((seed - Math.floor(seed)) * pebbleColors.length);
                    tCtx.fillStyle = pebbleColors[colorIdx];
                    let size = px * 1.0 + (seed - Math.floor(seed)) * px * 0.8;
                    tCtx.fillRect(x, y, size, size);
                }
            }

            tCtx.fillStyle = theme === 'day' ? '#b854cc' : '#00ffd5';
            for (let x = 0; x < w; x += px * 3) {
                if (Math.sin(x * 0.7) > 0) tCtx.fillRect(x, gravelY, px * 1.5, px * 0.8);
            }

            bgCacheMap.set(key, offCanvas);
            return offCanvas;
        }

        // ─── BUBBLES — square shape ──────────────────────────────────────────

        let bubbles = Array.from({ length: 22 }, () => ({
            x: Math.random(),
            y: Math.random(),
            speed: 0.0008 + Math.random() * 0.0012,
            size: Math.floor(Math.random() * 3) + 2,
            wobble: Math.random() * Math.PI * 2
        }));

        const PLANT_POSITIONS = [0.08, 0.20, 0.34, 0.48, 0.62, 0.76, 0.90];

        function drawDynamicBackgroundOverlays(tCtx, w, h, ratio, time, theme) {
            const px = Math.max(2, Math.floor(4 * ratio));
            const floorHeight = px * 3;
            const gravelY = h - floorHeight;
            const waveBaseY = px * 6;

            tCtx.save();
            tCtx.fillStyle = theme === 'day' ? '#08161f' : '#040b10';
            tCtx.beginPath();
            tCtx.moveTo(0, 0);
            tCtx.lineTo(w, 0);
            for (let x = w; x >= 0; x -= px * 2) {
                let wy = waveBaseY + Math.sin((x * 0.02) + (time * 2.5)) * (px * 2.5);
                tCtx.lineTo(x, wy);
            }
            let wy0 = waveBaseY + Math.sin(time * 2.5) * (px * 2.5);
            tCtx.lineTo(0, wy0);
            tCtx.lineTo(0, 0);
            tCtx.closePath();
            tCtx.fill();
            tCtx.restore();

            const waveColor = theme === 'day' ? 'rgba(255, 255, 255, 0.7)' : 'rgba(120, 220, 255, 0.5)';
            tCtx.fillStyle = waveColor;
            for (let x = 0; x < w; x += px * 4) {
                let waveY = waveBaseY + Math.sin((x * 0.02) + (time * 2.5)) * (px * 2.5);
                tCtx.fillRect(x, waveY, px * 3, px * 1.5);
            }

            PLANT_POSITIONS.forEach((posRatio, pIdx) => {
                const baseX = Math.floor((w * posRatio) / px) * px;
                const heightBlocks = 6 + (pIdx % 5) * 2 + Math.floor(Math.sin(pIdx * 1.7) * 2);
                const greenColor = theme === 'day' ? (pIdx % 2 === 0 ? '#109856' : '#00c868') : (pIdx % 2 === 0 ?
                    '#0a5832' : '#007840');
                const darkGreen = theme === 'day' ? (pIdx % 2 === 0 ? '#086438' : '#088848') : (pIdx % 2 === 0 ?
                    '#043820' : '#04502a');

                const stemW = px * 1.5;
                for (let b = 0; b < heightBlocks; b++) {
                    let waveOffset = Math.floor(Math.sin(time * 2.8 + b * 0.4 + pIdx * 1.1) * 2.2) * px;
                    let stemY = gravelY - (b * px * 2);
                    tCtx.fillStyle = darkGreen;
                    tCtx.fillRect(baseX + waveOffset, stemY, stemW, px * 2);
                    tCtx.fillStyle = greenColor;
                    tCtx.fillRect(baseX + waveOffset + stemW * 0.2, stemY, stemW * 0.6, px * 2);
                    if (b % 5 === 0 && b > 3) {
                        let leafDir = (b / 5) % 2 === 0 ? 1 : -1;
                        tCtx.fillStyle = greenColor;
                        tCtx.fillRect(baseX + waveOffset + (leafDir * stemW * 1.8), stemY + px * 0.5, stemW * 1.2, px *
                            0.8);
                    }
                }
            });
        }

        // ─── DRAW BUBBLES (square) ───────────────────────────────────────────

        function drawBubbles(tCtx, w, h, ratio, time, theme) {
            const px = Math.max(2, Math.floor(4 * ratio));
            const bubbleAlpha = theme === 'day' ? 0.20 : 0.18;

            bubbles.forEach(b => {
                b.wobble += 0.012;
                let bx = Math.floor((b.x * w + Math.sin(b.wobble) * px * 2.5) / px) * px;
                let by = Math.floor((b.y * h) / px) * px;
                let bSize = b.size * px;
                const half = bSize / 2;
                const corner = bSize * 0.2;

                tCtx.fillStyle = theme === 'day' ?
                    `rgba(255, 255, 255, ${bubbleAlpha * 0.6})` :
                    `rgba(0, 255, 220, ${bubbleAlpha * 0.5})`;
                tCtx.beginPath();
                tCtx.roundRect(bx, by, bSize, bSize, corner);
                tCtx.fill();

                tCtx.fillStyle = theme === 'day' ?
                    `rgba(255, 255, 255, ${bubbleAlpha * 0.5})` :
                    `rgba(0, 255, 220, ${bubbleAlpha * 0.4})`;
                const inset = bSize * 0.15;
                tCtx.beginPath();
                tCtx.roundRect(bx + inset, by + inset, bSize - inset * 2, bSize - inset * 2, corner * 0.7);
                tCtx.fill();

                tCtx.fillStyle = theme === 'day' ?
                    `rgba(255, 255, 255, ${bubbleAlpha * 0.35})` :
                    `rgba(255, 255, 255, ${bubbleAlpha * 0.3})`;
                const hlSize = bSize * 0.25;
                tCtx.fillRect(bx + bSize * 0.15, by + bSize * 0.15, hlSize, hlSize);
            });
        }

        // ─── PHYSICS ────────────────────────────────────────────────────────────

        let tankFish = [];
        let activePipCanvas = null;

        let lastWinX = window.screenX ?? window.screenLeft ?? 0;
        let lastWinY = window.screenY ?? window.screenTop ?? 0;
        let lastPipX = 0;
        let lastPipY = 0;

        let drawerFluid = { velX: 0, velY: 0, naturalWeight: 1.0 };
        let pipFluid = { velX: 0, velY: 0, naturalWeight: 1.0 };

        // ─── SYNC FISH ──────────────────────────────────────────────────────────

        function syncTankFish() {
            const currentTank = getCurrentTank();
            const fishSeeds = currentTank ? currentTank.fish : [];
            const existingMap = new Map(tankFish.map(f => [f.seed, f]));

            const now = performance.now();

            tankFish = fishSeeds.map(seed => {
                let fish = existingMap.get(seed);
                if (!fish) {
                    const rand = seededRandom(stringToSeed(seed));
                    const individualSpeedFactor = 0.75 + rand() * 0.5;
                    const dims = getFishBodyDimensions(seed);
                    fish = {
                        seed: seed,
                        nx: 0.2 + rand() * 0.6,
                        ny: 0.2 + rand() * 0.6,
                        nvx: 0,
                        nvy: 0,
                        speed: (0.0003 + rand() * 0.0002) * individualSpeedFactor,
                        dir: rand() < 0.5 ? 1 : -1,
                        wigglePhase: rand() * Math.PI * 2,
                        wiggleSpeed: (0.012 + rand() * 0.008) * individualSpeedFactor,
                        baseScale: 0.18,
                        targetPellet: null,
                        tiltAngle: 0,
                        targetTilt: 0,
                        bodyWidth: dims.bodyWidth,
                        bodyHeight: dims.bodyHeight
                    };
                }
                if (fish.targetPellet === undefined) fish.targetPellet = null;
                if (fish.tiltAngle === undefined) fish.tiltAngle = 0;
                if (fish.targetTilt === undefined) fish.targetTilt = 0;
                if (fish.bodyWidth === undefined || fish.bodyHeight === undefined) {
                    const dims = getFishBodyDimensions(seed);
                    fish.bodyWidth = dims.bodyWidth;
                    fish.bodyHeight = dims.bodyHeight;
                }
                return fish;
            });

            for (const f of tankFish) {
                if (f.targetPellet) {
                    const stillExists = pellets.some(p => p === f.targetPellet && p.active && !p.eaten);
                    if (!stillExists) {
                        f.targetPellet = null;
                        f.targetTilt = 0;
                    }
                }
            }
        }

        // ─── UPDATED PHYSICS: fish never stop, only turn on wall hit ────────

        function updateTankPhysics(drawerFluid, pipFluid) {
            const now = performance.now();

            bubbles.forEach(b => {
                b.y -= b.speed;
                if (b.y < -0.05) b.y = 1.05;
                b.wobble += 0.012;
            });

            const combinedVelX = drawerFluid.velX + pipFluid.velX;
            const combinedVelY = drawerFluid.velY + pipFluid.velY;
            const isMoving = Math.abs(combinedVelX) > 0.00005 || Math.abs(combinedVelY) > 0.00005;

            const cssW = (tankCanvasEl && tankCanvasEl.clientWidth) ? tankCanvasEl.clientWidth : 380;
            const cssH = (tankCanvasEl && tankCanvasEl.clientHeight) ? tankCanvasEl.clientHeight : window.innerHeight;
            const scaledFishRadius = Math.max(0.12, 0.52 / (1 + 0.45 * Math.log(Math.max(1, tankFish.length))));

            const MAX_FISH_SPEED = 0.008;
            const DRAG_FLIP_THRESHOLD = 0.0008;

            if (!isMoving && tankFish.length > 1) {
                const influenceRadius = Math.min(scaledFishRadius * 0.25, 0.10);
                const influenceRadiusSq = influenceRadius * influenceRadius;
                const aspect = cssW / cssH;
                const len = tankFish.length;

                for (let i = 0; i < len; i++) {
                    const f1 = tankFish[i];
                    for (let j = i + 1; j < len; j++) {
                        const f2 = tankFish[j];
                        let dx = (f2.nx - f1.nx) * aspect;
                        if (dx >= influenceRadius || dx <= -influenceRadius) continue;
                        let dy = f2.ny - f1.ny;
                        if (dy >= influenceRadius || dy <= -influenceRadius) continue;
                        let distSq = dx * dx + dy * dy;
                        if (distSq < influenceRadiusSq && distSq > 0.00000001) {
                            let dist = Math.sqrt(distSq);
                            let normDist = dist / influenceRadius;
                            let smoothFalloff = (1 - normDist) * (1 - normDist);
                            let nudgeForce = smoothFalloff * 0.000025;
                            let nx = dx / dist;
                            let ny = dy / dist;
                            f1.nvx -= (nx / aspect) * nudgeForce;
                            f1.nvy -= ny * nudgeForce;
                            f2.nvx += (nx / aspect) * nudgeForce;
                            f2.nvy += ny * nudgeForce;
                        }
                    }
                }
            }

            tankFish.forEach(fish => {
                const padXNorm = Math.max(0.08, (90 * scaledFishRadius) / cssW);
                const padYNorm = Math.max(0.08, (70 * scaledFishRadius) / cssH);
                const minNx = padXNorm;
                const maxNx = 1.0 - padXNorm;
                const minNy = padYNorm + 0.05;
                const maxNy = 1.0 - padYNorm;

                if (fish.targetPellet) {
                    fish.nvx = fish.nvx * 0.92 + combinedVelX * 0.04;
                    fish.nvy = fish.nvy * 0.92 + combinedVelY * 0.04;
                    let curSpeed = Math.hypot(fish.nvx, fish.nvy);
                    if (curSpeed > MAX_FISH_SPEED * 1.5) {
                        fish.nvx = (fish.nvx / curSpeed) * MAX_FISH_SPEED * 1.5;
                        fish.nvy = (fish.nvy / curSpeed) * MAX_FISH_SPEED * 1.5;
                    }
                    fish.nx += fish.nvx;
                    fish.ny += fish.nvy;
                    fish.nx = Math.max(minNx, Math.min(maxNx, fish.nx));
                    fish.ny = Math.max(minNy, Math.min(maxNy, fish.ny));
                    fish.wigglePhase += fish.wiggleSpeed;
                    return;
                }

                if (isMoving) {
                    fish.nvx = fish.nvx * 0.95 + combinedVelX * 0.05;
                    fish.nvy = fish.nvy * 0.95 + combinedVelY * 0.05;
                    if (Math.abs(combinedVelX) > DRAG_FLIP_THRESHOLD) {
                        let targetDir = combinedVelX > 0 ? 1 : -1;
                        let nearLeftWall = fish.nx <= minNx + 0.02;
                        let nearRightWall = fish.nx >= maxNx - 0.02;
                        if (!(targetDir === -1 && nearLeftWall) && !(targetDir === 1 && nearRightWall)) {
                            if (targetDir !== fish.dir) {
                                fish.dir = targetDir;
                            }
                        }
                    }
                } else {
                    fish.nvx *= 0.92;
                    fish.nvy *= 0.92;
                    if (Math.abs(fish.nvx) < 0.00001) fish.nvx = 0;
                    if (Math.abs(fish.nvy) < 0.00001) fish.nvy = 0;
                }

                const swimNx = fish.speed * fish.dir;
                fish.nx += fish.nvx + swimNx;
                fish.ny += fish.nvy;
                fish.wigglePhase += fish.wiggleSpeed;

                let wallHit = false;
                if (fish.nx <= minNx) {
                    fish.nx = minNx;
                    fish.nvx = Math.max(0, fish.nvx);
                    if (fish.dir === -1) { fish.dir = 1;
                        wallHit = true; }
                } else if (fish.nx >= maxNx) {
                    fish.nx = maxNx;
                    fish.nvx = Math.min(0, fish.nvx);
                    if (fish.dir === 1) { fish.dir = -1;
                        wallHit = true; }
                }
                if (fish.ny <= minNy) {
                    fish.ny = minNy;
                    fish.nvy = Math.max(0, -fish.nvy * 0.5);
                } else if (fish.ny >= maxNy) {
                    fish.ny = maxNy;
                    fish.nvy = Math.min(0, -fish.nvy * 0.5);
                }

                fish.targetTilt = 0;
                fish.tiltAngle += (0 - fish.tiltAngle) * 0.02;
                if (Math.abs(fish.tiltAngle) < 0.0005) fish.tiltAngle = 0;

                if (!fish.targetPellet) {
                    let found = false;
                    for (const p of pellets) {
                        if (p.active && !p.eaten && !p.targetedBy) {
                            if (assignFishToPellet(p)) {
                                found = true;
                                break;
                            }
                        }
                    }
                }
            });
        }

        // ─── DRAW TANK SCENE ────────────────────────────────────────────────────

        function drawTankScene(tCtx, cssW, cssH, ratio, time, theme) {
            const canvasW = cssW * ratio;
            const canvasH = cssH * ratio;

            tCtx.resetTransform();
            tCtx.clearRect(0, 0, canvasW, canvasH);

            const bgImage = getDitheredBgCache(canvasW, canvasH, ratio, theme);
            tCtx.drawImage(bgImage, 0, 0);

            drawDynamicBackgroundOverlays(tCtx, canvasW, canvasH, ratio, time, theme);

            if (tankFish.length > 0) {
                const scaledFishRadius = Math.max(0.12, 0.52 / (1 + 0.45 * Math.log(Math.max(1, tankFish.length))));
                const renderScale = scaledFishRadius * (cssW / 380) * ratio;
                tankFish.forEach(fish => {
                    const drawX = fish.nx * canvasW;
                    const drawY = (fish.ny + Math.sin(fish.wigglePhase * 0.8) * 0.01) * canvasH;
                    const tilt = fish.targetPellet ? fish.tiltAngle : fish.tiltAngle;
                    drawFishToCtx(tCtx, fish.seed, drawX, drawY, renderScale, fish.wigglePhase, fish.dir > 0, true,
                        tilt);
                });
            } else {
                tCtx.fillStyle = "#ffffff";
                tCtx.font = `${11 * ratio}px 'Press Start 2P', monospace`;
                tCtx.textAlign = "center";
                tCtx.shadowBlur = 6;
                tCtx.shadowColor = "black";
                tCtx.fillText("Fih tank is empty!", canvasW / 2, canvasH / 2);
                tCtx.fillText("Click KEEP to add fih.", canvasW / 2, canvasH / 2 + (28 * ratio));
                tCtx.shadowBlur = 0;
            }

            drawPellets(tCtx, canvasW, canvasH, ratio);
            drawBubbles(tCtx, canvasW, canvasH, ratio, time, theme);
        }

        let animStartTime = Date.now();

        // ─── ANIMATION LOOP ────────────────────────────────────────────────────

        function animateTankLoop() {
            const time = (Date.now() - animStartTime) / 1000;

            const curWinX = window.screenX ?? window.screenLeft ?? 0;
            const curWinY = window.screenY ?? window.screenTop ?? 0;
            let dWinX = curWinX - lastWinX;
            let dWinY = curWinY - lastWinY;
            lastWinX = curWinX;
            lastWinY = curWinY;

            if (Math.abs(dWinX) > 200) dWinX = 0;
            if (Math.abs(dWinY) > 200) dWinY = 0;

            const MOMENTUM_SENSITIVITY = 0.18;
            const MAX_DRAG_INPUT = 0.012;

            let renderScale = 0.18;
            let deviceCanvasW = 380;
            let deviceCanvasH = 300;

            if (tankCanvasEl && isTankOpen) {
                const ratio = window.devicePixelRatio || 1;
                const cssW = tankCanvasEl.clientWidth || 380;
                const cssH = tankCanvasEl.clientHeight || window.innerHeight;
                deviceCanvasW = cssW * ratio;
                deviceCanvasH = cssH * ratio;
                const scaledFishRadius = Math.max(0.12, 0.52 / (1 + 0.45 * Math.log(Math.max(1, tankFish.length))));
                renderScale = scaledFishRadius * (cssW / 380) * ratio;

                if (tankCanvasEl.width !== deviceCanvasW || tankCanvasEl.height !== deviceCanvasH) {
                    tankCanvasEl.width = deviceCanvasW;
                    tankCanvasEl.height = deviceCanvasH;
                }

                let rawVelX = (cssW > 0) ? (-dWinX / cssW) * MOMENTUM_SENSITIVITY : 0;
                let rawVelY = (cssH > 0) ? (-dWinY / cssH) * MOMENTUM_SENSITIVITY : 0;

                let inputMag = Math.hypot(rawVelX, rawVelY);
                if (inputMag > MAX_DRAG_INPUT) {
                    rawVelX = (rawVelX / inputMag) * MAX_DRAG_INPUT;
                    rawVelY = (rawVelY / inputMag) * MAX_DRAG_INPUT;
                }

                drawerFluid.velX = drawerFluid.velX * 0.983 + rawVelX * 0.017;
                drawerFluid.velY = drawerFluid.velY * 0.983 + rawVelY * 0.017;

                let moveSpeed = Math.hypot(drawerFluid.velX, drawerFluid.velY);
                drawerFluid.naturalWeight = Math.max(0, 1 - moveSpeed * 30);
            } else {
                drawerFluid.velX = 0;
                drawerFluid.velY = 0;
                drawerFluid.naturalWeight = 1.0;
            }

            if (activePipCanvas && pipWindowInstance) {
                const curPipX = pipWindowInstance.screenX ?? pipWindowInstance.screenLeft ?? 0;
                const curPipY = pipWindowInstance.screenY ?? pipWindowInstance.screenTop ?? 0;
                let dPipX = curPipX - lastPipX;
                let dPipY = curPipY - lastPipY;
                lastPipX = curPipX;
                lastPipY = curPipY;

                if (Math.abs(dPipX) > 200) dPipX = 0;
                if (Math.abs(dPipY) > 200) dPipY = 0;

                const pRatio = window.devicePixelRatio || 1;
                const pCssW = activePipCanvas.clientWidth || 400;
                const pCssH = activePipCanvas.clientHeight || 300;

                if (activePipCanvas.width !== pCssW * pRatio || activePipCanvas.height !== pCssH * pRatio) {
                    activePipCanvas.width = pCssW * pRatio;
                    activePipCanvas.height = pCssH * pRatio;
                }

                let rawPipVelX = (pCssW > 0) ? (-dPipX / pCssW) * MOMENTUM_SENSITIVITY : 0;
                let rawPipVelY = (pCssH > 0) ? (-dPipY / pCssH) * MOMENTUM_SENSITIVITY : 0;

                let pipInputMag = Math.hypot(rawPipVelX, rawPipVelY);
                if (pipInputMag > MAX_DRAG_INPUT) {
                    rawPipVelX = (rawPipVelX / pipInputMag) * MAX_DRAG_INPUT;
                    rawPipVelY = (rawPipVelY / pipInputMag) * MAX_DRAG_INPUT;
                }

                pipFluid.velX = pipFluid.velX * 0.983 + rawPipVelX * 0.017;
                pipFluid.velY = pipFluid.velY * 0.983 + rawPipVelY * 0.017;

                let pipMoveSpeed = Math.hypot(pipFluid.velX, pipFluid.velY);
                pipFluid.naturalWeight = Math.max(0, 1 - pipMoveSpeed * 30);
            } else {
                pipFluid.velX = 0;
                pipFluid.velY = 0;
                pipFluid.naturalWeight = 1.0;
            }

            updatePellets();
            updateFishTargeting(renderScale, deviceCanvasW, deviceCanvasH);

            if (isTankOpen || activePipCanvas) {
                updateTankPhysics(drawerFluid, pipFluid);
            }

            if (tankCanvasEl && isTankOpen) {
                const ratio = window.devicePixelRatio || 1;
                const cssW = tankCanvasEl.clientWidth || 380;
                const cssH = tankCanvasEl.clientHeight || window.innerHeight;
                const tCtx = tankCanvasEl.getContext('2d');
                drawTankScene(tCtx, cssW, cssH, ratio, time, currentTankTheme);
            }

            if (activePipCanvas && pipWindowInstance) {
                const pRatio = window.devicePixelRatio || 1;
                const pCssW = activePipCanvas.clientWidth || 400;
                const pCssH = activePipCanvas.clientHeight || 300;
                const pCtx = activePipCanvas.getContext('2d');
                drawTankScene(pCtx, pCssW, pCssH, pRatio, time, currentTankTheme);
            }

            requestAnimationFrame(animateTankLoop);
        }

        // ─── PICTURE-IN-PICTURE POPOUT ────────────────────────────────────────

        let pipWindowInstance = null;

        async function popOutTank() {
            if ('documentPictureInPicture' in window) {
                if (pipWindowInstance) {
                    pipWindowInstance.close();
                    return;
                }

                try {
                    pipWindowInstance = await window.documentPictureInPicture.requestWindow({
                        width: 420,
                        height: 340
                    });

                    const pipDoc = pipWindowInstance.document;
                    const styleEl = pipDoc.createElement('style');
                    styleEl.textContent = `
                body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0f2027; font-family:'Press Start 2P',monospace; }
                canvas { width:100%; height:100%; display:block; }
                .pip-header { position:absolute; top:0; left:0; right:0; z-index:10; background:rgba(8,22,31,0.85); backdrop-filter:blur(8px); padding:6px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,0.1); }
                .pip-header select { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; border-radius:4px; padding:4px 8px; font-family:'Press Start 2P',monospace; font-size:8px; cursor:pointer; outline:none; flex:1; min-width:0; }
                .pip-header select option { background:#102530; color:white; }
                .pip-header .pip-label { color:white; font-size:8px; white-space:nowrap; }
                .pip-header .pip-badge { background:#e74c3c; color:#fff; font-size:6px; padding:2px 5px; border-radius:3px; font-family:'Press Start 2P',monospace; white-space:nowrap; display:none; }
              `;
                    pipDoc.head.appendChild(styleEl);

                    const header = pipDoc.createElement('div');
                    header.className = 'pip-header';
                    header.innerHTML = `
                <span class="pip-label">🐟</span>
                <select id="pipTankSelector"></select>
                <span class="pip-badge" id="pipFullBadge">FULL</span>
              `;
                    pipDoc.body.appendChild(header);

                    activePipCanvas = pipDoc.createElement('canvas');
                    applyFishCursor(activePipCanvas);
                    pipDoc.body.appendChild(activePipCanvas);

                    function updatePipSelector() {
                        const sel = pipDoc.getElementById('pipTankSelector');
                        if (!sel) return;
                        const data = getTankData();
                        const tanks = data.tanks;
                        sel.innerHTML = '';
                        tanks.forEach((t, idx) => {
                            const opt = pipDoc.createElement('option');
                            opt.value = t.id;
                            let label = "Tank " + (idx + 1) + " (" + t.fish.length + " fish)";
                            if (isTankFull(t)) label += " FULL";
                            opt.textContent = label;
                            if (t.id === data.currentTankId) opt.selected = true;
                            sel.appendChild(opt);
                        });
                        const cur = tanks.find(t => t.id === data.currentTankId) || tanks[0];
                        const badge = pipDoc.getElementById('pipFullBadge');
                        if (badge) {
                            badge.style.display = isTankFull(cur) ? 'inline-block' : 'none';
                        }
                    }

                    updatePipSelector();

                    pipDoc.getElementById('pipTankSelector').addEventListener('change', function() {
                        const selectedId = this.value;
                        const data = getTankData();
                        if (data.currentTankId !== selectedId) {
                            data.currentTankId = selectedId;
                            saveTankData(data);
                            updateDrawerUI();
                            syncTankFish();
                            const cur = data.tanks.find(t => t.id === selectedId) || data.tanks[0];
                            const badge = pipDoc.getElementById('pipFullBadge');
                            if (badge) {
                                badge.style.display = isTankFull(cur) ? 'inline-block' : 'none';
                            }
                            const drawerSel = document.getElementById('drawerTankSelector');
                            if (drawerSel) {
                                for (let opt of drawerSel.options) {
                                    if (opt.value === selectedId) opt.selected = true;
                                }
                            }
                            const drawerLabel = document.getElementById('drawerTankLabel');
                            if (drawerLabel) {
                                let idx = data.tanks.indexOf(cur);
                                drawerLabel.textContent = "Tank " + (idx + 1);
                            }
                        }
                    });

                    setupCanvasClickHandler(activePipCanvas, true);

                    closeTank();
                    setTankButtonState(true);

                    pipWindowInstance.addEventListener('pagehide', () => {
                        pipWindowInstance = null;
                        activePipCanvas = null;
                        setTankButtonState(false);
                        updateDrawerUI();
                        syncTankFish();
                    });

                } catch (e) {
                    alert("Unable to open Picture-in-Picture window.");
                }
            } else {
                alert("Picture-in-Picture API is not supported in this browser.");
            }
        }

        window.addEventListener('resize', resizeAndDraw);

        // ─── INIT ───────────────────────────────────────────────────────────────

        (function init() {
            let data = getTankData();
            if (!data.tanks || data.tanks.length === 0) {
                data.tanks = [{ id: "tank_1", fish: [] }];
                data.currentTankId = "tank_1";
                saveTankData(data);
            }
            if (!data.tanks.find(t => t.id === data.currentTankId)) {
                data.currentTankId = data.tanks[0].id;
                saveTankData(data);
            }
            updateDrawerUI();
            syncTankFish();
            if (tankCanvasEl) {
                setupCanvasClickHandler(tankCanvasEl, false);
                applyFishCursor(tankCanvasEl);
            }
        })();

        resizeAndDraw();
        requestAnimationFrame(animateTankLoop);
    </script>
</body>
