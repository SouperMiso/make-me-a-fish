<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Device Fish</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f2027;
            background: linear-gradient(to bottom, #203a43, #0f2027);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        #title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            text-shadow: 4px 4px 0px #333333; 
            z-index: 10;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
        }

        @media (max-width: 600px) {
            #title {
                font-size: 16px;
                top: 30px;
            }
        }
    </style>
</head>
<body>

    <div id="title">11:11, make a fih!</div>

    <canvas id="fishCanvas"></canvas>

    <script>
        // --- 1. Local Storage for Device ID ---
        let deviceId = localStorage.getItem("fish_device_id");
        if (!deviceId) {
            deviceId = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            localStorage.setItem("fish_device_id", deviceId);
        }

        // --- 2. Time Logic (11:11 PST/PDT Rollover) ---
        function getFishDayString() {
            let now = new Date();
            
            let ptFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Los_Angeles',
                year: 'numeric', month: 'numeric', day: 'numeric',
                hour: 'numeric', minute: 'numeric', hour12: false
            });
            
            let parts = ptFormatter.formatToParts(now);
            let pt = {};
            parts.forEach(p => {
                if(p.type !== 'literal') pt[p.type] = parseInt(p.value);
            });

            let isPast1111 = (pt.hour > 11) || (pt.hour === 11 && pt.minute >= 11);
            
            let fishDate = new Date(pt.year, pt.month - 1, pt.day);
            if (!isPast1111) {
                fishDate.setDate(fishDate.getDate() - 1);
            }
            
            return `${fishDate.getFullYear()}-${fishDate.getMonth() + 1}-${fishDate.getDate()}`;
        }

        // --- 3. Seeded Random Number Generator ---
        function stringToSeed(str) {
            let h = 0xdeadbeef;
            for(let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 2654435761);
            }
            return (h ^ h >>> 16) >>> 0;
        }

        function seededRandom(seed) {
            return function() {
                var t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // --- 4. Canvas Drawing Logic ---
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');

        function resizeAndDraw() {
            const ratio = window.devicePixelRatio || 1;
            
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            
            canvas.width = window.innerWidth * ratio;
            canvas.height = window.innerHeight * ratio;
            
            ctx.scale(ratio, ratio);
            
            drawFish();
        }

        function drawFish() {
            const dailySeedString = deviceId + "-" + getFishDayString();
            const rand = seededRandom(stringToSeed(dailySeedString));

            function randomRange(min, max) {
                return min + rand() * (max - min);
            }

            // Helper to pick a random item from an array based on the seed
            function pick(arr) {
                return arr[Math.floor(rand() * arr.length)];
            }

            const width = window.innerWidth;
            const height = window.innerHeight;

            ctx.clearRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            // Generate Geometric Variations
            const bodyType = pick(['ellipse', 'box', 'diamond', 'pill']);
            const tailType = pick(['triangle', 'forked', 'paddle']);
            const patternType = pick(['scales', 'stripes', 'spots', 'grid', 'none']);
            const eyeType = pick(['round', 'slit', 'square']);

            // Dimensional Math
            const bodyWidth = randomRange(100, 250);
            const bodyHeight = randomRange(60, 150);
            const tailSize = randomRange(50, 120);
            const tailAngle = randomRange(0.3, 0.8);
            
            // Color Math
            const hueBase = randomRange(0, 360);
            const bodyColor = `hsl(${hueBase}, 80%, 50%)`;
            const finColor = `hsl(${(hueBase + pick([-40, 40, 180])) % 360}, 90%, 60%)`; // 180 creates a complementary color
            const scaleColor = `hsla(${(hueBase + 20) % 360}, 80%, 30%, 0.5)`;

            // Helper to draw the main body path (used for filling and clipping)
            function traceBody() {
                ctx.beginPath();
                if (bodyType === 'ellipse') {
                    ctx.ellipse(cx, cy, bodyWidth, bodyHeight, 0, 0, Math.PI * 2);
                } else if (bodyType === 'box') {
                    ctx.roundRect(cx - bodyWidth, cy - bodyHeight, bodyWidth * 2, bodyHeight * 2, 15);
                } else if (bodyType === 'pill') {
                    ctx.roundRect(cx - bodyWidth, cy - bodyHeight, bodyWidth * 2, bodyHeight * 2, bodyHeight);
                } else if (bodyType === 'diamond') {
                    ctx.moveTo(cx - bodyWidth, cy);
                    ctx.lineTo(cx, cy - bodyHeight);
                    ctx.lineTo(cx + bodyWidth, cy);
                    ctx.lineTo(cx, cy + bodyHeight);
                    ctx.closePath();
                }
            }

            // 1. Draw Tail (Behind body)
            ctx.fillStyle = finColor;
            ctx.beginPath();
            const tailX = cx - bodyWidth + (bodyWidth * 0.1); 
            
            if (tailType === 'triangle') {
                ctx.moveTo(tailX, cy);
                ctx.lineTo(tailX - tailSize, cy - (tailSize * tailAngle));
                ctx.lineTo(tailX - tailSize, cy + (tailSize * tailAngle));
            } else if (tailType === 'forked') {
                ctx.moveTo(tailX, cy);
                ctx.lineTo(tailX - tailSize, cy - (tailSize * tailAngle));
                ctx.lineTo(tailX - tailSize * 0.5, cy);
                ctx.lineTo(tailX - tailSize, cy + (tailSize * tailAngle));
            } else if (tailType === 'paddle') {
                ctx.moveTo(tailX, cy - tailSize / 2);
                ctx.lineTo(tailX - tailSize, cy - tailSize / 2);
                ctx.lineTo(tailX - tailSize, cy + tailSize / 2);
                ctx.lineTo(tailX, cy + tailSize / 2);
            }
            ctx.closePath();
            ctx.fill();

            // 2. Draw Top Fin
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy - bodyHeight + 10);
            ctx.lineTo(cx + randomRange(10, 50), cy - bodyHeight - randomRange(40, 90));
            ctx.lineTo(cx + 40, cy - bodyHeight + 10);
            ctx.fill();

            // 3. Draw Bottom Fin
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy + bodyHeight - 10);
            ctx.lineTo(cx + randomRange(10, 40), cy + bodyHeight + randomRange(30, 70));
            ctx.lineTo(cx + 30, cy + bodyHeight - 10);
            ctx.fill();

            // 4. Draw Main Body
            ctx.save();
            traceBody();
            ctx.fillStyle = bodyColor;
            ctx.fill();
            
            // Mask textures inside body
            ctx.clip(); 

            // Draw Patterns
            ctx.strokeStyle = scaleColor;
            ctx.fillStyle = scaleColor;
            const patternScale = randomRange(15, 30);

            if (patternType === 'scales') {
                ctx.lineWidth = randomRange(2, 4);
                for (let x = cx + bodyWidth; x > cx - bodyWidth; x -= patternScale * 0.8) {
                    for (let y = cy - bodyHeight; y < cy + bodyHeight; y += patternScale * 1.2) {
                        let yOffset = (Math.floor(x / patternScale) % 2 === 0) ? (patternScale * 0.6) : 0;
                        ctx.beginPath();
                        ctx.arc(x, y + yOffset, patternScale, -Math.PI / 2, Math.PI / 2);
                        ctx.stroke();
                    }
                }
            } else if (patternType === 'stripes') {
                ctx.lineWidth = randomRange(5, 15);
                for (let x = cx - bodyWidth + 10; x < cx + bodyWidth; x += patternScale * 1.5) {
                    ctx.beginPath();
                    ctx.moveTo(x, cy - bodyHeight);
                    ctx.lineTo(x, cy + bodyHeight);
                    ctx.stroke();
                }
            } else if (patternType === 'grid') {
                ctx.lineWidth = randomRange(3, 6);
                for (let x = cx - bodyWidth; x < cx + bodyWidth; x += patternScale) {
                    ctx.beginPath(); ctx.moveTo(x, cy - bodyHeight); ctx.lineTo(x, cy + bodyHeight); ctx.stroke();
                }
                for (let y = cy - bodyHeight; y < cy + bodyHeight; y += patternScale) {
                    ctx.beginPath(); ctx.moveTo(cx - bodyWidth, y); ctx.lineTo(cx + bodyWidth, y); ctx.stroke();
                }
            } else if (patternType === 'spots') {
                const numSpots = Math.floor(randomRange(15, 40));
                for(let i = 0; i < numSpots; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        cx + randomRange(-bodyWidth, bodyWidth), 
                        cy + randomRange(-bodyHeight, bodyHeight), 
                        randomRange(5, 20), 0, Math.PI * 2
                    );
                    ctx.fill();
                }
            }
            
            ctx.restore(); // Remove clipping mask

            // 5. Draw Eye
            const eyeX = cx + bodyWidth * (bodyType === 'diamond' ? 0.3 : 0.5);
            const eyeY = cy - bodyHeight * 0.2;
            const eyeRadius = randomRange(10, 22);
            
            ctx.fillStyle = "white";
            
            if (eyeType === 'square') {
                ctx.fillRect(eyeX - eyeRadius, eyeY - eyeRadius, eyeRadius * 2, eyeRadius * 2);
                ctx.fillStyle = "black";
                ctx.fillRect(eyeX, eyeY - eyeRadius / 2, eyeRadius, eyeRadius);
            } else {
                // Round Eye Base
                ctx.beginPath();
                ctx.arc(eyeX, eyeY, eyeRadius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "black";
                if (eyeType === 'slit') {
                    // Cat/Reptile slit pupil
                    ctx.beginPath();
                    ctx.ellipse(eyeX + eyeRadius * 0.2, eyeY, eyeRadius * 0.2, eyeRadius * 0.7, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Standard round pupil
                    ctx.beginPath();
                    ctx.arc(eyeX + (eyeRadius * 0.2), eyeY, eyeRadius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Listeners & Init
        window.addEventListener('resize', resizeAndDraw);
        resizeAndDraw();
    </script>
</body>
</html>
